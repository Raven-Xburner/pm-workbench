<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#2E5B4E">
<meta name="description" content="产品经理日常集成工作台：今日待办、需求看板、会议纪要、数据周报、灵感素材。单文件离线可用，数据存本机浏览器。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="产品工作台">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232E5B4E'/%3E%3Cg fill='%23F5F3EE'%3E%3Crect x='15' y='17' width='7' height='7' rx='2'/%3E%3Crect x='15' y='28.5' width='7' height='7' rx='2'/%3E%3Crect x='15' y='40' width='7' height='7' rx='2'/%3E%3Crect x='28' y='18' width='21' height='5' rx='2.5'/%3E%3Crect x='28' y='29.5' width='21' height='5' rx='2.5'/%3E%3Crect x='28' y='41' width='14' height='5' rx='2.5'/%3E%3C/g%3E%3C/svg%3E">
<title>产品工作台 · Product Desk</title>
<!-- 单文件工作台：零外链、零依赖、数据保存在本机浏览器 localStorage -->
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --paper:#F5F3EE; --paper-2:#EFEDE6;
  --surface:#FFFFFF; --surface-2:#FBFAF7; --surface-3:#F1EEE8;
  --ink:#211F1C; --ink-2:#565149; --ink-3:#8C857A; --ink-4:#B4ADA2;
  --line:rgba(33,31,28,.085); --line-2:rgba(33,31,28,.16);
  --accent:#2E5B4E; --accent-2:#3D7663; --accent-soft:rgba(46,91,78,.075);
  --danger:#AE4A30; --danger-soft:rgba(174,74,48,.085);
  --warn:#9C7320; --warn-soft:rgba(156,115,32,.10);
  --ok:#3B7359;
  --r:14px; --r-sm:9px; --r-xs:6px;
  --serif:"Songti SC","Source Han Serif SC","Noto Serif CJK SC","STSong",Georgia,"SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  --sh:0 1px 2px rgba(33,31,28,.035), 0 10px 30px -22px rgba(33,31,28,.35);
  --sh-lg:0 2px 6px rgba(33,31,28,.05), 0 30px 60px -30px rgba(33,31,28,.35);
}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.62;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(1100px 620px at 92% -12%, rgba(46,91,78,.055), transparent 62%),
    radial-gradient(880px 520px at -12% 104%, rgba(174,74,48,.042), transparent 62%);
}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(46,91,78,.28)}
a:hover{border-bottom-color:var(--accent)}
::selection{background:rgba(46,91,78,.16)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============ 布局 ============ */
.app{position:relative;z-index:1;display:flex;align-items:flex-start;min-height:100vh}
.rail{
  flex:0 0 232px; width:232px; position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column; gap:22px;
  padding:26px 16px 20px;
  border-right:1px solid var(--line);
  background:linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.24));
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand-mark{
  width:34px;height:34px;flex:0 0 34px;border-radius:10px;
  background:linear-gradient(145deg,#356B5B,#24483D); color:#FCFBF8;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif); font-size:15px; letter-spacing:.02em;
  box-shadow:0 6px 16px -8px rgba(36,72,61,.9);
}
.brand b{display:block;font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.06em;line-height:1.25}
.brand em{display:block;font-style:normal;font-size:10px;letter-spacing:.22em;color:var(--ink-4);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  position:relative; display:flex; align-items:center; gap:10px;
  padding:9px 10px 9px 12px; border-radius:9px; color:var(--ink-2);
  font-size:13.5px; letter-spacing:.01em; transition:background .16s,color .16s;
  text-align:left; width:100%;
}
.nav-item svg{flex:0 0 17px;opacity:.72}
.nav-item:hover{background:rgba(33,31,28,.045);color:var(--ink)}
.nav-item.on{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:var(--sh)}
.nav-item.on svg{opacity:1}
.nav-item .ni-bar{position:absolute;left:0;top:50%;transform:translateY(-50%);width:2.5px;height:0;border-radius:2px;background:var(--accent);transition:height .2s}
.nav-item.on .ni-bar{height:17px}
.nav-item .ni-n{margin-left:auto;font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.nav-item.on .ni-n{color:var(--accent-2)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px}
.sync{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:0 0 6px}
.dot.busy{background:var(--warn)} .dot.bad{background:var(--danger)}
.rail-quote{
  border-top:1px solid var(--line); padding:12px 6px 0; margin:0 6px;
  font-family:var(--serif); font-size:12px; color:var(--ink-4); line-height:1.8; letter-spacing:.03em;
}
.main{flex:1;min-width:0;padding:26px 40px 96px;max-width:1160px}
.topbar{display:flex;align-items:flex-end;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line-2);margin-bottom:22px}
.vtitle{font-family:var(--serif);font-size:25px;font-weight:600;letter-spacing:.05em;line-height:1.2}
.vsub{font-size:12.5px;color:var(--ink-3);margin-top:5px;letter-spacing:.02em}
.top-actions{margin-left:auto;display:flex;gap:7px;align-items:center}

/* ============ 通用控件 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:36px;padding:7px 14px;border-radius:9px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-2);font-size:13px;letter-spacing:.02em;
  transition:border-color .16s,background .16s,color .16s,transform .1s;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:#FCFBF8}
.btn.solid:hover{background:var(--accent-2);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-3)}
.btn.ghost:hover{background:rgba(33,31,28,.05);color:var(--ink)}
.btn.danger{color:var(--danger);border-color:rgba(174,74,48,.3)}
.btn.danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:12px;border-radius:8px}
.btn svg{flex:0 0 auto}
.icon-btn{
  width:36px;height:36px;border-radius:9px;border:1px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);background:var(--surface);
  transition:.16s;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn.on{background:var(--accent-soft);border-color:rgba(46,91,78,.3);color:var(--accent)}

.field{display:flex;flex-direction:column;gap:6px}
.field > label{font-size:11.5px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.inp,.sel,.ta{
  width:100%;min-height:40px;padding:9px 12px;border:1px solid var(--line-2);border-radius:9px;
  background:var(--surface);font-size:16px;line-height:1.5;transition:border-color .16s,box-shadow .16s;
}
.ta{resize:vertical;min-height:84px;font-size:15px}
.inp:focus,.sel:focus,.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sel{appearance:none;-webkit-appearance:none;padding-right:32px;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238C857A' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--surface);font-size:12px;color:var(--ink-2);
  letter-spacing:.02em;min-height:28px;transition:.16s;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#FCFBF8}
.tag{
  display:inline-flex;align-items:center;padding:1px 7px;border-radius:5px;font-size:11px;
  letter-spacing:.03em;background:var(--surface-3);color:var(--ink-3);white-space:nowrap;
}
.pri{display:inline-flex;align-items:center;gap:4px;font-size:11px;letter-spacing:.06em;font-weight:600}
.pri i{width:6px;height:6px;border-radius:2px;display:block}
.pri.p0{color:var(--danger)} .pri.p0 i{background:var(--danger)}
.pri.p1{color:var(--warn)} .pri.p1 i{background:var(--warn)}
.pri.p2{color:var(--ink-3)} .pri.p2 i{background:var(--ink-4)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:30px 0 12px}
.sec-head h2{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.09em;white-space:nowrap}
.sec-head .rule{flex:1;height:1px;background:var(--line);transform:translateY(-3px)}
.sec-head .meta{font-size:11.5px;color:var(--ink-4);letter-spacing:.06em;white-space:nowrap}
.empty{padding:34px 20px;text-align:center;color:var(--ink-4);font-size:13px;border:1px dashed var(--line-2);border-radius:var(--r);background:rgba(255,255,255,.5)}
.empty svg{margin-bottom:10px;opacity:.5}

/* ============ 视图切换 ============ */
.view{display:none;animation:fade .26s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ============ 今日 ============ */
.day-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:20px}
.day-badge{
  flex:0 0 76px;text-align:center;padding:10px 0 8px;border-radius:var(--r);
  border:1px solid var(--line-2);background:var(--surface);box-shadow:var(--sh);
}
.day-badge b{display:block;font-family:var(--serif);font-size:30px;line-height:1;font-weight:600;letter-spacing:.01em}
.day-badge span{display:block;font-size:10.5px;letter-spacing:.16em;color:var(--ink-4);margin-top:5px;text-transform:uppercase}
.day-talk{padding-top:2px}
.day-talk h3{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.04em}
.day-talk p{color:var(--ink-3);font-size:13px;margin-top:6px;max-width:60ch}
.kpis{display:flex;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:6px}
.kpi{flex:1 1 110px;padding:14px 18px 13px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:7px;letter-spacing:.08em}
.kpi.hot b{color:var(--danger)}

.quick{display:flex;gap:9px;align-items:center;padding:12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh);margin:16px 0 4px;flex-wrap:wrap}
.quick .inp{flex:1 1 240px;min-height:38px;border-color:transparent;background:var(--surface-2);font-size:15px}
.quick .inp:focus{background:var(--surface);border-color:var(--accent)}
.quick .sel{flex:0 0 108px;width:108px;min-height:38px;font-size:13px}
.quick .date{flex:0 0 138px;width:138px;min-height:38px;font-size:13px}

.group{margin-top:16px}
.group-h{display:flex;align-items:center;gap:8px;margin-bottom:2px;padding:0 2px}
.group-h em{font-style:normal;font-size:12px;letter-spacing:.12em;color:var(--ink-3)}
.group-h .cnt{font-size:11px;color:var(--ink-4)}
.group-h .bar{width:14px;height:2px;border-radius:2px;background:var(--ink-4)}
.group-h.g-hot em{color:var(--danger)} .group-h.g-hot .bar{background:var(--danger)}
.group-h.g-warm em{color:var(--warn)} .group-h.g-warm .bar{background:var(--warn)}
.rows{border-top:1px solid var(--line)}
.row{
  display:flex;align-items:flex-start;gap:11px;padding:11px 4px 11px 2px;
  border-bottom:1px solid var(--line);position:relative;transition:background .14s;
}
.row:hover{background:rgba(255,255,255,.72)}
.row::before{content:'';position:absolute;left:-2px;top:11px;bottom:11px;width:2px;border-radius:2px;background:transparent}
.row.hot::before{background:var(--danger)}
.row.soon::before{background:var(--warn)}
.row .cb{
  flex:0 0 20px;width:20px;height:20px;margin-top:2px;border:1.4px solid var(--ink-4);border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:transparent;transition:.16s;background:var(--surface);
}
.row .cb:hover{border-color:var(--accent);color:var(--accent-2)}
.row.done .cb{background:var(--accent);border-color:var(--accent);color:#fff}
.row .body{flex:1;min-width:0;cursor:pointer}
.row .t{font-size:14px;letter-spacing:.01em;word-break:break-word}
.row.done .t{color:var(--ink-4);text-decoration:line-through;text-decoration-color:var(--ink-4)}
.row .meta{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:5px;font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
.row .meta .due{font-variant-numeric:tabular-nums}
.row .meta .due.over{color:var(--danger);font-weight:600}
.row .acts{display:flex;gap:4px;opacity:0;transition:opacity .16s;flex:0 0 auto}
.row:hover .acts,.row:focus-within .acts{opacity:1}
.mini{width:28px;height:28px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);transition:.14s}
.mini:hover{background:var(--surface-3);color:var(--accent)}
.mini.del:hover{color:var(--danger)}

/* ============ 看板 / 列表 ============ */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .inp{flex:1 1 200px;min-height:38px;font-size:14px}
.toolbar .sel{flex:0 0 auto;width:auto;min-height:38px;font-size:13px;padding-right:30px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{padding:8px 13px;font-size:12.5px;color:var(--ink-3);letter-spacing:.04em;min-height:38px}
.seg button.on{background:var(--accent);color:#FCFBF8}

.kb{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 14px;align-items:flex-start}
.kb-col{flex:0 0 258px;width:258px;background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:var(--r);padding:11px 11px 13px}
.kb-col > h4{display:flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.12em;color:var(--ink-3);font-weight:500;margin-bottom:10px}
.kb-col > h4 .n{margin-left:auto;font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.kb-col > h4 .kdot{width:6px;height:6px;border-radius:50%;background:var(--ink-4)}
.kb-col[data-st="待评估"] .kdot{background:#9AA6AE}
.kb-col[data-st="规划中"] .kdot{background:#5E7FA6}
.kb-col[data-st="开发中"] .kdot{background:var(--accent)}
.kb-col[data-st="测试中"] .kdot{background:var(--warn)}
.kb-col[data-st="已上线"] .kdot{background:#7F8C7F}
.kb-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 11px;
  margin-bottom:8px;box-shadow:0 1px 2px rgba(33,31,28,.03);transition:.16s;cursor:pointer;
}
.kb-card:hover{border-color:var(--line-2);box-shadow:var(--sh);transform:translateY(-1px)}
.kb-card .kt{font-size:13.2px;line-height:1.5;letter-spacing:.01em;word-break:break-word}
.kb-card .km{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:8px;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.kb-card .km .over{color:var(--danger);font-weight:600}
.kb-move{display:flex;gap:3px;justify-content:flex-end;margin-top:7px}
.kb-move button{width:26px;height:26px;border-radius:7px;color:var(--ink-4);display:inline-flex;align-items:center;justify-content:center}
.kb-move button:hover{background:var(--surface-3);color:var(--accent)}
.kb-move button:disabled{opacity:.28;cursor:not-allowed}
.kb-empty{font-size:12px;color:var(--ink-4);text-align:center;padding:14px 0;letter-spacing:.06em}
.kb-hint{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-4);letter-spacing:.03em;padding:2px 2px 0}

.tbl{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.tbl-row{display:grid;grid-template-columns:1.9fr .7fr .62fr .8fr .62fr 78px;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
.tbl-row:last-child{border-bottom:0}
.tbl-row.hd{background:var(--surface-2);font-size:11px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.tbl-row:not(.hd):hover{background:var(--surface-2)}
.tbl-row .cell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.tbl-row .cell.name{color:var(--ink);font-size:13.5px;cursor:pointer}
.tbl-row .cell.name:hover{color:var(--accent)}
.tbl-row .acts{display:flex;gap:2px;justify-content:flex-end}

/* ============ 会议 ============ */
.mgrid{display:flex;flex-direction:column;gap:12px}
.mcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh);overflow:hidden}
.mcard > .mh{display:flex;gap:14px;padding:14px 16px;align-items:flex-start}
.mdate{flex:0 0 54px;font-variant-numeric:tabular-nums}
.mdate b{display:block;font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.1}
.mdate span{display:block;font-size:10.5px;letter-spacing:.1em;color:var(--ink-4);margin-top:2px}
.mcard .mtitle{font-size:14.5px;letter-spacing:.02em;font-weight:600}
.mcard .mpeople{font-size:12px;color:var(--ink-3);margin-top:5px}
.mcard .mbtns{margin-left:auto;display:flex;gap:3px;align-items:center}
.mcard .mbody{padding:0 16px 15px;border-top:1px solid var(--line);margin-top:0;padding-top:13px}
.mcard .msec{margin-bottom:12px}
.mcard .msec:last-child{margin-bottom:0}
.mcard .msec h5{font-size:11px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;margin-bottom:5px;font-weight:500}
.mcard .msec p{font-size:13.2px;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.fu{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line)}
.fu:first-of-type{border-top:0}
.fu .cbsm{flex:0 0 17px;width:17px;height:17px;margin-top:2px;border:1.3px solid var(--ink-4);border-radius:5px;display:flex;align-items:center;justify-content:center;color:transparent;background:var(--surface)}
.fu.on .cbsm{background:var(--accent);border-color:var(--accent);color:#fff}
.fu span{font-size:13px;flex:1}
.fu.on span{color:var(--ink-4);text-decoration:line-through}
.fu .to-task{font-size:11px;color:var(--ink-4);border-bottom:1px dashed var(--line-2)}
.fu .to-task:hover{color:var(--accent);border-bottom-color:var(--accent)}
.progress{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-3)}
.pbar{width:54px;height:3px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:2px}

/* ============ 指标 ============ */
.mtwrap{display:grid;grid-template-columns:1fr;gap:18px}
.chartbox{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px 18px 12px;box-shadow:var(--sh)}
.chartbox .ch{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.chartbox .ch h4{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.06em}
.chartbox .ch .big{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1;margin-left:auto;font-variant-numeric:tabular-nums}
.chartbox .ch .delta{font-size:12px;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.delta.up{color:var(--danger)} .delta.down{color:var(--ok)} .delta.flat{color:var(--ink-3)}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.chart-note{font-size:11.5px;color:var(--ink-4);margin-top:6px;letter-spacing:.03em}
.ptdot{cursor:pointer}
.ptdot:hover circle{r:5.5}

.rpt{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh);overflow:hidden}
.rpt > .rh{display:flex;gap:10px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rpt > .rh h4{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.06em}
.rpt > .rh .sp{margin-left:auto;display:flex;gap:6px}
.rpt textarea{
  width:100%;border:0;border-radius:0;min-height:300px;padding:16px;background:var(--surface-2);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,var(--sans);font-size:12.8px;line-height:1.85;
  resize:vertical;color:var(--ink-2);
}
.rpt textarea:focus{outline:none;background:var(--surface)}
.rpt-list{display:flex;flex-direction:column;gap:8px}
.rpt-item{display:flex;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.rpt-item b{font-size:13px;font-weight:600}
.rpt-item span{font-size:11.5px;color:var(--ink-4)}
.rpt-item .sp{margin-left:auto;display:flex;gap:3px}

/* ============ 灵感库 ============ */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:13px}
.icard{
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 15px;
  box-shadow:0 1px 2px rgba(33,31,28,.03);transition:.18s;display:flex;flex-direction:column;gap:8px;
}
.icard:hover{box-shadow:var(--sh);transform:translateY(-2px);border-color:var(--line-2)}
.icard h4{font-size:14px;letter-spacing:.01em;line-height:1.5;word-break:break-word}
.icard p{font-size:12.5px;color:var(--ink-3);line-height:1.7;word-break:break-word}
.icard .ifoot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px}
.stars{display:inline-flex;gap:2px;color:var(--warn)}
.icard .ifoot .sp{margin-left:auto;display:flex;gap:2px}

/* ============ 模态 / 抽屉 ============ */
.mask{position:fixed;inset:0;background:rgba(33,31,28,.34);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:80;display:flex;justify-content:flex-end;animation:fade .2s}
.mask.center{align-items:center;justify-content:center;padding:20px}
.sheet{
  width:min(560px,100%);height:100%;background:var(--paper);display:flex;flex-direction:column;
  box-shadow:var(--sh-lg);animation:slide .28s cubic-bezier(.22,.7,.3,1);
}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet > .sh{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line-2)}
.sheet > .sh h3{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.06em}
.sheet > .sb{padding:20px 22px 26px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.sheet > .sf{padding:14px 22px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end;background:var(--surface-2)}
.dialog{
  width:min(460px,100%);background:var(--paper);border-radius:var(--r);box-shadow:var(--sh-lg);
  padding:24px 24px 20px;animation:fade .2s;max-height:88vh;overflow-y:auto;
}
.dialog h3{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.06em;margin-bottom:10px}
.dialog p{font-size:13.2px;color:var(--ink-2);line-height:1.8}
.dialog .dlg-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ============ 提示条 ============ */
.banners{display:flex;flex-direction:column;gap:9px;margin-bottom:18px}
.banner{
  display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);
  border:1px solid var(--line-2);background:var(--surface);font-size:13px;box-shadow:var(--sh);
}
.banner svg{flex:0 0 17px;margin-top:1px}
.banner .bt{flex:1;min-width:0}
.banner .bt b{display:block;font-size:13px;font-weight:600;letter-spacing:.02em;margin-bottom:2px}
.banner .bt p{font-size:12.5px;color:var(--ink-3);line-height:1.7}
.banner .bacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.banner.warn{background:var(--warn-soft);border-color:rgba(156,115,32,.28)}
.banner.warn svg{color:var(--warn)}
.banner.danger{background:var(--danger-soft);border-color:rgba(174,74,48,.3)}
.banner.danger svg{color:var(--danger)}
.banner.info{background:var(--accent-soft);border-color:rgba(46,91,78,.25)}
.banner.info svg{color:var(--accent)}

/* ============ Toast ============ */
.toast-root{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(420px,92vw)}
.toast{
  pointer-events:auto;background:rgba(33,31,28,.94);color:#F6F4EF;font-size:13px;letter-spacing:.02em;
  padding:10px 16px;border-radius:999px;box-shadow:var(--sh-lg);animation:pop .24s;max-width:100%;text-align:center;
}
.toast.bad{background:#8E3A25}
.toast.good{background:#2A5A47}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}

.recover{padding:8px 0}
.recover ul{margin:10px 0 0 18px;padding:0;font-size:13px;color:var(--ink-2);line-height:1.9}

/* ============ 响应式 ============ */
/* ============ 宽屏适配（≥1320px）：消除右侧留白 ============ */
@media (min-width:1320px){
  .main{max-width:1680px;padding:28px 46px 96px}

  /* 今日：任务主列 + 概览侧栏，右侧不再空着 */
  #view-today.on{
    display:grid;grid-template-columns:minmax(0,1fr) 336px;
    grid-template-areas:"head rail" "quick rail" "list rail";
    column-gap:44px;align-items:start;
  }
  #view-today .day-head{grid-area:head}
  #view-today .quick{grid-area:quick}
  #view-today #todayGroups{grid-area:list}
  #view-today .kpis{
    grid-area:rail;display:block;margin:2px 0 0;border:1px solid var(--line-2);
    border-radius:var(--r);background:var(--surface);box-shadow:var(--sh);overflow:hidden;
  }
  #view-today .kpis .kpi{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding:13px 16px;border-right:0;border-bottom:1px solid var(--line);
  }
  #view-today .kpis .kpi:last-child{border-bottom:0}
  #view-today .kpis .kpi span{order:1;margin-top:0}
  #view-today .kpis .kpi b{order:2;font-size:21px}

  /* 需求看板：五列随宽度自适应铺满整行 */
  .kb-col{flex:1 1 240px;width:auto;min-width:240px}

  /* 会议纪要 / 周报存档：自适应多列并排（各自保持自然高度，互不拉伸） */
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:14px;align-items:start}
  .rpt-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:10px;align-items:start}

  /* 灵感库：宽屏多收一列，避免卡片过宽 */
  .igrid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
}

@media (max-width:900px){
  .app{display:block}
  .rail{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;flex:0 0 auto;
    flex-direction:row;align-items:center;gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    border-right:0;border-top:1px solid var(--line-2);z-index:60;overflow-x:auto;
    background:rgba(252,251,248,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .rail .brand,.rail .rail-foot,.rail .rail-quote{display:none}
  .nav{flex-direction:row;flex:1;gap:2px;min-width:0}
  .nav-item{flex:1 1 0;width:auto;min-width:0;flex-direction:column;gap:3px;padding:7px 4px;font-size:10.5px;
    min-height:50px;justify-content:center;align-items:center;letter-spacing:.02em;text-align:center}
  .nav-item .ni-bar{display:none}
  .nav-item .ni-n{display:none}
  .nav-item span.lbl{white-space:nowrap}
  /* 触控目标放大（44px 准则）：视觉尺寸不变，扩大命中区 */
  .row .cb{position:relative}
  .row .cb::after{content:'';position:absolute;inset:-10px;border-radius:8px}
  .row .acts .mini{position:relative}
  .row .acts .mini::after{content:'';position:absolute;inset:-7px;border-radius:10px}
  .kb-move button::after{content:'';position:absolute;inset:-6px}
  .kb-move button{position:relative}
  .icon-btn{width:40px;height:40px}
  .btn{min-height:42px}
  .btn.sm{min-height:38px}
  .quick .btn{min-height:46px}
  .row{padding:13px 2px}
  .main{padding:16px 16px 92px;max-width:none}
  .topbar{padding-bottom:12px;margin-bottom:16px;flex-wrap:wrap}
  .vtitle{font-size:21px}
  .vsub{font-size:11.5px}
  .day-head{gap:12px}
  .day-badge{flex:0 0 62px}
  .day-badge b{font-size:24px}
  .day-talk h3{font-size:16.5px}
  .day-talk p{font-size:12.5px}
  .kpi{flex:1 1 46%;border-right:0;border-bottom:1px solid var(--line);padding:12px 14px}
  .kpi:nth-child(odd){border-right:1px solid var(--line)}
  .kpi:nth-last-child(-n+2){border-bottom:0}
  .kpi b{font-size:20px}
  .quick{padding:10px;gap:8px}
  .quick .inp{flex:1 1 100%}
  .quick .sel{flex:1 1 calc(50% - 5px);width:auto}
  .quick .date{flex:1 1 calc(50% - 5px);width:auto}
  .quick .btn{flex:1 1 100%}
  .row{padding:12px 2px}
  .row .acts{opacity:1}
  .tbl{border:0;background:transparent;overflow:visible}
  .tbl-row.hd{display:none}
  .tbl-row{display:block;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);margin-bottom:9px;padding:12px 14px}
  .tbl-row .cell{white-space:normal;overflow:visible;display:flex;gap:6px;align-items:baseline;margin-bottom:3px}
  .tbl-row .cell::before{content:attr(data-l);font-size:10.5px;letter-spacing:.1em;color:var(--ink-4);min-width:46px;text-transform:uppercase}
  .tbl-row .cell.name::before{display:none}
  .tbl-row .acts{justify-content:flex-start;margin-top:8px}
  .kb-col{flex:0 0 82vw;width:82vw}
  .igrid{grid-template-columns:1fr}
  .row-2,.row-3{grid-template-columns:1fr}
  .sheet{width:100%;border-radius:0}
  .rpt > .rh .sp{width:100%;margin-left:0}
  .chartbox{padding:14px 12px 8px}
  .chartbox .ch .big{font-size:24px;margin-left:0;width:100%}
  .toast-root{bottom:calc(78px + env(safe-area-inset-bottom))}
  .sec-head{margin:24px 0 10px}
}
@media (max-width:400px){
  .kpi b{font-size:18px}
  .main{padding:14px 13px 90px}
}
@media print{.rail,.topbar,.toolbar,.banners,.toast-root{display:none!important}.view{display:block!important}}
</style>

<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <span class="brand-mark">产</span>
      <div><b>产品工作台</b><em>Product Desk</em></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-quote">「先想清楚问题，<br>再决定做什么功能。」</div>

      <div class="sync" id="syncState"><span class="dot" id="syncDot"></span><span id="syncText">已就绪</span></div>
      <button class="btn sm ghost" id="railBackup" style="justify-content:flex-start;padding-left:2px">导出 JSON 备份</button>

    <section class="view" id="view-board"></section>
    <section class="view" id="view-meet"></section>
    <section class="view" id="view-metric"></section>
    <section class="view" id="view-ideas"></section>

</div>
<div id="modalRoot"></div>

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function uid(p){ return (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function todayStr(d){
  d = d || new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function parseDate(s){
  if(!s) return null;
  var p = String(s).split('-');
  if(p.length !== 3) return null;
  var y = parseInt(p[0],10), m = parseInt(p[1],10), d = parseInt(p[2],10);
  if(!y || !m || !d) return null;
  return new Date(y, m-1, d);
}
function dayDiff(a, b){           // b - a，单位天（只算日期）
  if(!a || !b) return 0;
  var x = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  var y = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((y - x) / 86400000);
}
function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function fmtMD(s){
  var d = parseDate(s); if(!d) return '—';
  return (d.getMonth()+1) + '月' + d.getDate() + '日';
}
function relDue(s){
  var d = parseDate(s); if(!d) return {txt:'未设截止', over:false, soon:false};
  var n = dayDiff(new Date(), d);
  if(n < 0)  return {txt:'逾期 ' + Math.abs(n) + ' 天', over:true,  soon:false, n:n};
  if(n === 0) return {txt:'今天到期', over:false, soon:true, n:0};
  if(n === 1) return {txt:'明天到期', over:false, soon:true, n:1};
  if(n <= 3)  return {txt:n + ' 天后到期', over:false, soon:true, n:n};
  return {txt:fmtMD(s), over:false, soon:false, n:n};
}
function weekStart(d){
  d = d ? new Date(d.getFullYear(), d.getMonth(), d.getDate()) : new Date();
  var w = d.getDay();                     // 0 周日
  var back = (w === 0 ? 6 : w - 1);       // 周一为一周起点
  return addDays(d, -back);
}
function greet(){
  var h = new Date().getHours();
  if(h < 6)  return '夜深了';
  if(h < 11) return '早上好';
  if(h < 14) return '中午好';
  if(h < 18) return '下午好';
  return '晚上好';
}
function clampNum(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
function fmtNum(n){
  if(!isFinite(n)) return '0';
  var a = Math.abs(n);
  if(a >= 100000000) return (n/100000000).toFixed(2).replace(/\.?0+$/,'') + '亿';
  if(a >= 10000) return (n/10000).toFixed(2).replace(/\.?0+$/,'') + '万';
  if(a >= 1000) return n.toLocaleString('zh-CN');
  return String(Math.round(n * 100) / 100);
}

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){
  try{ localStorage.setItem(k, v); return { ok:true }; }
  catch(e){
    var msg = '写入失败';
    try{
      if(e && (e.name === 'QuotaExceededError' || e.code === 22 || e.name === 'NS_ERROR_DOM_QUOTA_REACHED'))
        msg = '浏览器存储空间已满（QuotaExceeded）';
      else if(e && e.name === 'SecurityError')
        msg = '浏览器禁止了本地存储（可能是隐私模式或站点限制）';
      else if(e && e.message) msg = e.name + '：' + e.message;
    }catch(_){}
    return { ok:false, err:msg };
  }
}
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function lsOk(){

function normalize(d){
  var s = blankState();
  if(!d || typeof d !== 'object') return s;
  ['tasks','meetings','metrics','ideas','reports'].forEach(function(k){
    if(Array.isArray(d[k])) s[k] = d[k];
  });
  if(d.meta && typeof d.meta === 'object'){
    for(var k2 in d.meta){ if(Object.prototype.hasOwnProperty.call(d.meta, k2)) s.meta[k2] = d.meta[k2]; }
  }
  // 字段补全，防止手工改过的备份缺字段
  s.tasks = s.tasks.map(function(t){
    return { id:t.id || uid('t'), title:t.title || '(未命名)', desc:t.desc || '', status:STATUSES.indexOf(t.status) >= 0 ? t.status : '待评估',
      priority:PRIOS.indexOf(t.priority) >= 0 ? t.priority : 'P2', owner:t.owner || '', due:t.due || '',
      tags:Array.isArray(t.tags) ? t.tags : [], createdAt:t.createdAt || new Date().toISOString(),
      doneAt:t.doneAt || '', fromMeeting:t.fromMeeting || '' };
  });
  s.meetings = s.meetings.map(function(m){
    return { id:m.id || uid('m'), date:m.date || todayStr(), title:m.title || '(未命名会议)',
      attendees:m.attendees || '', agenda:m.agenda || '', decisions:m.decisions || '',
      followups:Array.isArray(m.followups) ? m.followups.map(function(f){
        return { id:f.id || uid('f'), text:f.text || '', done:!!f.done };
      }) : [],
      createdAt:m.createdAt || new Date().toISOString() };
  });
  s.metrics = s.metrics.map(function(d){
    return { id:d.id || uid('d'), date:d.date || todayStr(), name:d.name || '未命名指标',
      value:clampNum(d.value), unit:d.unit || '', note:d.note || '' };
  });
  s.ideas = s.ideas.map(function(i){
    return { id:i.id || uid('i'), title:i.title || '(未命名)', url:i.url || '', tag:i.tag || '未分类',
      rating:Math.max(0, Math.min(5, parseInt(i.rating,10) || 0)), note:i.note || '',
      createdAt:i.createdAt || new Date().toISOString() };
  });
  s.reports = s.reports.map(function(r){
    return { id:r.id || uid('r'), start:r.start || '', content:r.content || '', createdAt:r.createdAt || new Date().toISOString() };
  });
  s.meta.sinceExport = parseInt(s.meta.sinceExport,10) || 0;
  return s;
}

/* ---- 写盘 ---- */
function persist(){
  if(!state) return false;
  var json;
  try{ json = JSON.stringify(state); }
  catch(e){ showStoreFail('数据序列化失败：' + e.message); return false; }

  if(json === lastJson){ renderSaveState(); return true; }

  // 上一份可用数据留作快照，损坏时可回滚
  if(lastJson) lsSet(K_SNAP, lastJson);

  var r = lsSet(K_DATA, json);
  if(!r.ok){
    store.ok = false; store.err = r.err;
    renderSaveState(); renderBanners();
    return false;
  }
  // 校验回读
  var back = lsGet(K_DATA);
  if(back !== json){
    store.ok = false; store.err = '写入后回读不一致（存储可能被截断）';
    renderSaveState(); renderBanners();
    return false;
  }
  store.ok = true; store.err = ''; store.savedAt = Date.now(); lastJson = json;
  renderSaveState();
  return true;
}
function showStoreFail(msg){
  store.ok = false; store.err = msg;
  renderSaveState(); renderBanners();
  toast('保存失败：' + msg, 'bad');
}
function touchAdd(n){
  if(!state) return;
  state.meta.sinceExport = (parseInt(state.meta.sinceExport,10) || 0) + (n || 1);
  persist(); renderBanners();
}
function totalRecords(){
  if(!state) return 0;
  return state.tasks.length + state.meetings.length + state.metrics.length + state.ideas.length + state.reports.length;
}

function toast(msg, kind, ms){
  var root = $('toastRoot');
  if(!root) return;
  var el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(function(){
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0'; el.style.transform = 'translateY(8px)';
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 320);
  }, ms || 2400);
}
var modalStack = [];
function closeModal(){
  var m = modalStack.pop();
  if(m && m.parentNode) m.parentNode.removeChild(m);
  if(!modalStack.length) document.body.style.overflow = '';
}
function openModal(html, opts){
  opts = opts || {};
  var mask = document.createElement('div');
  mask.className = 'mask' + (opts.center ? ' center' : '');
  mask.innerHTML = html;
  $('modalRoot').appendChild(mask);
  modalStack.push(mask);
  document.body.style.overflow = 'hidden';
  mask.addEventListener('mousedown', function(e){
    if(e.target === mask && !opts.noClose) closeModal();
  });
  var focusEl = mask.querySelector('[data-autofocus]');
  if(focusEl) setTimeout(function(){ try{ focusEl.focus(); }catch(e){} }, 60);
  return mask;
}
function confirmBox(title, body, okText, onOk, danger){
  var mask = openModal(
    '<div class="dialog">' +
      '<h3>' + esc(title) + '</h3>' +
      '<div style="font-size:13.2px;color:var(--ink-2);line-height:1.8">' + body + '</div>' +
      '<div class="dlg-acts">' +
        '<button class="btn" data-x="cancel">取消</button>' +
        '<button class="btn ' + (danger ? 'danger' : 'solid') + '" data-x="ok">' + esc(okText || '确定') + '</button>' +
      '</div>' +
    '</div>', { center:true });
  mask.querySelector('[data-x="cancel"]').onclick = closeModal;
  mask.querySelector('[data-x="ok"]').onclick = function(){ closeModal(); if(onOk) onOk(); };
}

    '<div class="igrid" id="ideaBody"></div>';
}

/* ---- 横幅（备份提醒 / 存储异常 / 演示数据） ---- */
function renderBanners(){
  var host = $('banners'); if(!host) return;
  var out = '';

  if(!store.ok){
    out += '<div class="banner danger">' + ic('alert',17) +
      '<div class="bt"><b>保存失败，本次改动可能只在当前页面有效</b>' +
      '<p>' + esc(store.err || '未知原因') + '。建议立刻导出 JSON 备份，然后清理浏览器存储或关闭隐私模式后重新导入。</p>' +
      '<div class="bacts">' +
        '<button class="btn sm solid" data-b="exp">' + ic('down',13) + '立即导出备份</button>' +
        '<button class="btn sm" data-b="retry">' + ic('refresh',13) + '重试保存</button>' +
        '<button class="btn sm ghost" data-b="sethide">知道了</button>' +
      '</div></div></div>';
  }

  var n = state ? (parseInt(state.meta.sinceExport,10) || 0) : 0;
  if(store.ok && !ui.backupHintOff && n >= BACKUP_EVERY){
    out += '<div class="banner warn">' + ic('shield',17) +
      '<div class="bt"><b>自上次导出以来已新增 ' + n + ' 条记录</b>' +
      '<p>数据只存在这台设备的浏览器里。建议导出一份 JSON 备份（手机上可存到文件 App / 网盘）。</p>' +
      '<div class="bacts">' +
        '<button class="btn sm solid" data-b="exp">' + ic('down',13) + '导出备份</button>' +
        '<button class="btn sm ghost" data-b="backoff">稍后提醒（再满 ' + BACKUP_EVERY + ' 条时）</button>' +
      '</div></div></div>';
  }

  if(state && state.meta && state.meta.demo){
    out += '<div class="banner info">' + ic('bulb',17) +
      '<div class="bt"><b>当前是演示数据</b>' +
      '<p>共 ' + totalRecords() + ' 条示例记录，用来展示各模块的样子。你可以先随便点着看，正式使用前一键清空。</p>' +
      '<div class="bacts">' +
        '<button class="btn sm" data-b="cleardemo">' + ic('trash',13) + '清空演示数据</button>' +
        '<button class="btn sm ghost" data-b="demooff">保留，我自己删</button>' +
      '</div></div></div>';
  }

  host.innerHTML = out;
  var els = host.querySelectorAll('[data-b]');
  for(var i = 0; i < els.length; i++){
    els[i].onclick = function(){
      var act = this.getAttribute('data-b');
      if(act === 'exp') doExport();
      else if(act === 'retry'){ persist(); toast(store.ok ? '已重新保存' : '仍然失败：' + store.err, store.ok ? 'good' : 'bad'); renderBanners(); }
      else if(act === 'sethide'){ state.meta.sinceExport = 0; persist(); renderBanners(); }
      else if(act === 'backoff'){ ui.backupHintOff = true; renderBanners(); }
      else if(act === 'cleardemo') clearDemo();
      else if(act === 'demooff'){ state.meta.demo = false; persist(); renderBanners(); toast('已保留演示数据，可在设置里清空'); }
    };
  }
}
function clearDemo(){
  confirmBox('清空演示数据',
    '将删除全部示例需求、会议、指标与灵感记录，得到一个干净的工作台。<br>此操作不可撤销，建议先导出备份。',
    '确认清空', function(){
      var s = blankState();
      s.meta.owner = state.meta.owner || '';
      s.meta.lastExport = state.meta.lastExport || '';
      s.meta.sinceExport = 0;
      s.meta.demo = false;
      state = s; lastJson = '';
      lsDel(K_SNAP);
      persist(); refreshAll();
      toast('演示数据已清空，开始你的工作台吧', 'good');
    }, true);
}

   6. 通用片段
   ======================================================================== */
function emptyBox(iconName, text, sub){
  return '<div class="empty">' + ic(iconName, 26) +
    '<div>' + esc(text) + '</div>' +
    (sub ? '<div style="font-size:11.5px;margin-top:5px;opacity:.8">' + esc(sub) + '</div>' : '') +
  '</div>';
}
function prioHtml(p){
  var cls = p === 'P0' ? 'p0' : (p === 'P1' ? 'p1' : 'p2');
  return '<span class="pri ' + cls + '"><i></i>' + esc(PRIO_TXT[p] || p) + '</span>';
}
function tagHtml(tags){
  if(!tags || !tags.length) return '';
  var out = '';
  for(var i = 0; i < Math.min(tags.length, 3); i++) out += '<span class="tag">' + esc(tags[i]) + '</span>';
  return out;
}
function statusTagHtml(s){
  var col = s === '已上线' ? 'color:var(--ok)' : (s === '测试中' ? 'color:var(--warn)' : (s === '开发中' ? 'color:var(--accent)' : ''));
  return '<span class="tag" style="' + col + '">' + esc(s) + '</span>';
}
function tagsToStr(tags){ return (tags || []).join('、'); }
function strToTags(s){
  return String(s || '').split(/[，,、\s]+/).filter(function(x){ return !!x; });
}
function findById(list, id){
  for(var i = 0; i < list.length; i++){ if(list[i].id === id) return list[i]; }
  return null;
}

/* ========================================================================
   7. 模块一：今日（今天要处理 / 快速记录 / 概览）
   ======================================================================== */
function renderToday(){
  var now = new Date();
  var wk = ['周日','周一','周二','周三','周四','周五','周六'][now.getDay()];
  $('dayNum').textContent = now.getDate();
  $('dayMon').textContent = (now.getMonth() + 1) + '月 · ' + wk;
  $('dayGreet').textContent = greet() + '，' + (state.meta.owner ? state.meta.owner : '产品同学');

  var t0 = todayStr();
  var open = state.tasks.filter(function(t){ return t.status !== '已上线'; });
  var over = open.filter(function(t){ return t.due && t.due < t0; });
  var today = open.filter(function(t){ return t.due === t0; });
  var soon = open.filter(function(t){
    if(!t.due) return false;
    var n = dayDiff(now, parseDate(t.due));
    return n > 0 && n <= 3;
  });
  var nodate = open.filter(function(t){ return !t.due; });
  var doing = open.filter(function(t){ return t.status === '开发中' || t.status === '测试中'; });

  // 一句话摘要
  var sum;
  if(over.length){
    sum = '有 ' + over.length + ' 项已经逾期，最久的一项拖了 ' +
      Math.abs(dayDiff(now, parseDate(over[0].due))) + ' 天。先处理它，或者干脆砍掉它。';
  }else if(today.length){
    sum = '今天有 ' + today.length + ' 项到期，节奏还算稳。做完记得点左边的方块。';
  }else if(open.length){
    sum = '今天没有到期的活儿，' + open.length + ' 项在手上。可以挑一件推进一下。';
  }else{
    sum = '手上没有未完成的事，很难得。要么享受，要么去找点新问题。';
  }
  $('daySum').textContent = sum;

  // KPI 条
  var wkStart = todayStr(weekStart(now));
  var doneThisWeek = state.tasks.filter(function(t){
    return t.doneAt && t.doneAt.slice(0,10) >= wkStart;
  }).length;
  var meetThisWeek = state.meetings.filter(function(m){ return m.date >= wkStart; }).length;
  var fuOpen = 0;
  state.meetings.forEach(function(m){
    (m.followups || []).forEach(function(f){ if(!f.done) fuOpen++; });
  });
  $('dayKpis').innerHTML =
    kpi(over.length, '逾期未完成', over.length > 0) +
    kpi(today.length, '今天到期') +
    kpi(doneThisWeek, '本周已完成') +
    kpi(doing.length, '进行中') +
    kpi(fuOpen, '会议待跟进');

  // 分组列表
  var html = '';
  if(over.length)      html += taskGroup('逾期未完成', over, 'g-hot', true);
  if(today.length)     html += taskGroup('今天到期', today, 'g-warm', false);
  if(soon.length)      html += taskGroup('未来三天', soon, '', false);
  if(nodate.length)    html += taskGroup('没设截止（容易烂尾）', nodate, '', false);

  var doneRecently = state.tasks.filter(function(t){
    return t.doneAt && t.doneAt.slice(0,10) === t0;
  });
  if(doneRecently.length) html += taskGroup('今天已完成', doneRecently, '', false);

  if(!html){
    html = emptyBox('check', '今天没有待处理的事项', '在上面输入框记一件，回车即保存');
  }
  $('todayGroups').innerHTML = html;
  bindTaskRows($('todayGroups'));
}
function kpi(v, label, hot){
  return '<div class="kpi' + (hot ? ' hot' : '') + '"><b>' + v + '</b><span>' + esc(label) + '</span></div>';
}
function taskGroup(title, list, cls, isOverdue){
  var rows = '';
  for(var i = 0; i < list.length; i++) rows += taskRow(list[i], isOverdue);
  return '<div class="group">' +
    '<div class="group-h ' + (cls || '') + '"><span class="bar"></span><em>' + esc(title) + '</em>' +
      '<span class="cnt">' + list.length + ' 项</span></div>' +
    '<div class="rows">' + rows + '</div>' +
  '</div>';
}
function taskRow(t, isOverdue){
  var done = t.status === '已上线';
  var due = relDue(t.due);
  var cls = 'row' + (done ? ' done' : '') + (isOverdue || due.over ? ' hot' : (due.soon ? ' soon' : ''));
  var metaBits = [prioHtml(t.priority), statusTagHtml(t.status)];
  metaBits.push('<span class="due' + (due.over ? ' over' : '') + '">' + esc(due.txt) + '</span>');
  if(t.owner) metaBits.push('<span>· ' + esc(t.owner) + '</span>');
  var tg = tagHtml(t.tags);
  if(tg) metaBits.push(tg);

  var acts = '<div class="acts">' +
    (due.over ? '<button class="mini" data-act="snooze" data-id="' + t.id + '" title="顺延到今天">' + ic('rightSm',15) + '</button>' : '') +
    '<button class="mini" data-act="edit" data-id="' + t.id + '" title="编辑">' + ic('edit',15) + '</button>' +
    '<button class="mini del" data-act="del" data-id="' + t.id + '" title="删除">' + ic('trash',15) + '</button>' +
  '</div>';

  return '<div class="' + cls + '" data-row="task" data-id="' + t.id + '">' +
    '<button class="cb" data-act="toggle" data-id="' + t.id + '" aria-label="切换完成">' + ic('check',13) + '</button>' +
    '<div class="body" data-act="edit" data-id="' + t.id + '" title="点按查看 / 编辑详情">' +
      '<div class="t">' + esc(t.title) + '</div>' +
      '<div class="meta">' + metaBits.join('') + '</div>' +
    '</div>' + acts +
  '</div>';
}
function bindTaskRows(scope){
  var els = scope.querySelectorAll('[data-act]');
  for(var i = 0; i < els.length; i++){
    els[i].onclick = function(ev){
      ev.stopPropagation();
      var act = this.getAttribute('data-act'), id = this.getAttribute('data-id');
      if(act === 'toggle') toggleTask(id);
      else if(act === 'del') removeTask(id);
      else if(act === 'edit') openTaskSheet(id);
      else if(act === 'snooze') snoozeTask(id);
    };
  }
}
function toggleTask(id){
  var t = findById(state.tasks, id);
  if(!t) return;
  if(t.status === '已上线'){
    t.status = '开发中'; t.doneAt = '';
  }else{
    t.status = '已上线'; t.doneAt = new Date().toISOString();
  }
  persist(); refreshAll();
}
function snoozeTask(id){
  var t = findById(state.tasks, id);
  if(!t) return;
  var old = t.due;
  t.due = todayStr();
  persist(); refreshAll();
  toast('已从 ' + fmtMD(old) + ' 顺延到今天', '', 1800);
}
function removeTask(id){
  var t = findById(state.tasks, id);
  if(!t) return;
  confirmBox('删除这条需求？', '「' + esc(t.title) + '」<br>删除后无法恢复。', '删除', function(){
    state.tasks = state.tasks.filter(function(x){ return x.id !== id; });
    persist(); refreshAll(); toast('已删除');
  }, true);
}
function openTaskSheet(id, preset){
  var t = id ? findById(state.tasks, id) : null;
  var isNew = !t;
  if(isNew){
    t = { id:uid('t'), title:'', desc:'', status:'待评估', priority:'P1', owner:state.meta.owner || '我',
          due:'', tags:[], createdAt:new Date().toISOString(), doneAt:'', fromMeeting:'' };
  }
  if(preset){
    for(var k in preset){ if(Object.prototype.hasOwnProperty.call(preset, k)) t[k] = preset[k]; }
  }
  var body =
    '<div class="field"><label>需求 / 任务标题</label>' +
      '<input class="inp" id="tkTitle" data-autofocus maxlength="200" value="' + esc(t.title) + '" placeholder="一句话说清要做什么"></div>' +
    '<div class="field"><label>背景与备注</label>' +
      '<textarea class="ta" id="tkDesc" placeholder="为什么要做？约束是什么？验收标准？">' + esc(t.desc) + '</textarea></div>' +
    '<div class="row-3">' +
      '<div class="field"><label>优先级</label><select class="sel" id="tkPrio">' +
        optionHtml(PRIOS, PRIO_TXT, t.priority) + '</select></div>' +
      '<div class="field"><label>当前状态</label><select class="sel" id="tkStatus">' +
        optionHtml(STATUSES, null, t.status) + '</select></div>' +
      '<div class="field"><label>负责人</label><input class="inp" id="tkOwner" value="' + esc(t.owner) + '" placeholder="我 / 某某"></div>' +
    '</div>' +
    '<div class="row-2">' +
      '<div class="field"><label>期望上线 / 截止</label><input class="inp" type="date" id="tkDue" value="' + esc(t.due) + '"></div>' +
      '<div class="field"><label>标签（逗号分隔）</label><input class="inp" id="tkTags" value="' + esc(tagsToStr(t.tags)) + '" placeholder="会员、改版"></div>' +
    '</div>' +
    '<p style="font-size:11.5px;color:var(--ink-4);line-height:1.8">改动实时保存到本机浏览器。勾选完成即视为「已上线」。</p>';

  var foot = '<button class="btn" data-x="cancel">取消</button>' +
    '<button class="btn solid" data-x="save">' + (isNew ? '创建需求' : '保存改动') + '</button>';
  var mask = openModal(sheetHtml(isNew ? '新建需求' : '需求详情', body, foot));
  bindSheetClose(mask);
  mask.querySelector('[data-x="cancel"]').onclick = closeModal;
  mask.querySelector('[data-x="save"]').onclick = function(){
    var title = mask.querySelector('#tkTitle').value.trim();
    if(!title){ toast('标题不能为空', 'bad'); return; }
    t.title = title;
    t.desc = mask.querySelector('#tkDesc').value.trim();
    t.priority = mask.querySelector('#tkPrio').value;
    t.status = mask.querySelector('#tkStatus').value;
    t.owner = mask.querySelector('#tkOwner').value.trim();
    t.due = mask.querySelector('#tkDue').value;
    t.tags = strToTags(mask.querySelector('#tkTags').value);
    if(t.status === '已上线' && !t.doneAt) t.doneAt = new Date().toISOString();
    if(t.status !== '已上线') t.doneAt = '';
    if(isNew){ state.tasks.unshift(t); }
    persist();
    if(isNew) touchAdd(1); else renderBanners();
    closeModal(); refreshAll();
    toast(isNew ? '已创建' : '已保存', 'good');
  };
}
function optionHtml(values, labels, cur){
  var out = '';
  for(var i = 0; i < values.length; i++){
    var v = values[i], lab = labels ? (labels[v] || v) : v;
    out += '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(lab) + '</option>';
  }
  return out;
}

/* ========================================================================
   8. 模块二：需求看板（看板 / 列表双视图 + 筛选 + 状态流转）
   ======================================================================== */
function filterTasks(){
  var q = ui.q.trim().toLowerCase();
  return state.tasks.filter(function(t){
    if(ui.prio && t.priority !== ui.prio) return false;
    if(ui.owner && (t.owner || '未指派') !== ui.owner) return false;
    if(q){
      var hay = (t.title + ' ' + t.desc + ' ' + (t.tags || []).join(' ') + ' ' + (t.owner || '')).toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}
function renderBoard(){
  if(!$('boardBody')) return;
  // 负责人下拉，仅在选项集变化时重建，避免打断用户选择
  var sel = $('bOwner');
  var owners = [];
  state.tasks.forEach(function(t){
    var o = t.owner || '未指派';
    if(owners.indexOf(o) < 0) owners.push(o);
  });
  var curOwners = sel.getAttribute('data-set') || '';
  var key = owners.join('|');
  if(curOwners !== key){
    var opts = '<option value="">全部负责人</option>';
    for(var i = 0; i < owners.length; i++)
      opts += '<option value="' + esc(owners[i]) + '"' + (owners[i] === ui.owner ? ' selected' : '') + '>' + esc(owners[i]) + '</option>';
    sel.innerHTML = opts;
    sel.setAttribute('data-set', key);
  }

  var list = filterTasks();
  var body = $('boardBody');
  if(ui.boardView === 'list') body.innerHTML = boardTable(list);
  else body.innerHTML = boardKanban(list);
  bindBoard(body);
}
function boardKanban(list){
  var html = '<div class="kb">';
  for(var s = 0; s < STATUSES.length; s++){
    var st = STATUSES[s];
    var col = list.filter(function(t){ return t.status === st; });
    html += '<div class="kb-col" data-st="' + esc(st) + '">' +
      '<h4><span class="kdot"></span>' + esc(st) + '<span class="n">' + col.length + '</span></h4>';
    if(!col.length) html += '<div class="kb-empty">空</div>';
    for(var i = 0; i < col.length; i++){
      var t = col[i], due = relDue(t.due);
      html += '<div class="kb-card" data-open="' + t.id + '">' +
        '<div class="kt">' + esc(t.title) + '</div>' +
        '<div class="km">' + prioHtml(t.priority) +
          (t.due ? '<span class="' + (due.over ? 'over' : '') + '">' + esc(due.txt) + '</span>' : '<span>未设截止</span>') +
          (t.owner ? '<span>· ' + esc(t.owner) + '</span>' : '') +
        '</div>' +
        (tagHtml(t.tags) ? '<div class="km">' + tagHtml(t.tags) + '</div>' : '') +
        '<div class="kb-move">' +
          '<button data-mv="' + t.id + '" data-dir="-1"' + (s === 0 ? ' disabled' : '') + ' aria-label="后退一步">' + ic('left',14) + '</button>' +
          '<button data-mv="' + t.id + '" data-dir="1"' + (s === STATUSES.length - 1 ? ' disabled' : '') + ' aria-label="推进一步">' + ic('right',14) + '</button>' +
        '</div>' +
      '</div>';
    }
    html += '</div>';
  }
  return html + '</div>' +
    '<div class="kb-hint">' + ic('rightSm',13) + ' 看板可左右滑动，共 ' + STATUSES.length +
      ' 个阶段；点卡片看详情，用角落箭头推进状态</div>';
}
function boardTable(list){
  if(!list.length) return emptyBox('board', '没有符合条件的需求', '换个筛选条件，或者新建一条');
  var html = '<div class="tbl"><div class="tbl-row hd">' +
    '<div>需求</div><div>优先级</div><div>状态</div><div>负责人</div><div>截止</div><div></div></div>';
  var sorted = list.slice().sort(function(a, b){
    var order = {P0:0, P1:1, P2:2};
    if(order[a.priority] !== order[b.priority]) return order[a.priority] - order[b.priority];
    return (a.due || '9999') < (b.due || '9999') ? -1 : 1;
  });
  for(var i = 0; i < sorted.length; i++){
    var t = sorted[i], due = relDue(t.due);
    html += '<div class="tbl-row" data-open="' + t.id + '">' +
      '<div class="cell name" data-l="需求">' + esc(t.title) + '</div>' +
      '<div class="cell" data-l="优先级">' + prioHtml(t.priority) + '</div>' +
      '<div class="cell" data-l="状态">' + statusTagHtml(t.status) + '</div>' +
      '<div class="cell" data-l="负责人">' + esc(t.owner || '未指派') + '</div>' +
      '<div class="cell" data-l="截止"><span class="' + (due.over ? 'pri p0' : '') + '">' + esc(due.txt) + '</span></div>' +
      '<div class="acts">' +

/* ---- 8b. 看板状态流转 ---- */
function moveTask(id, dir){
  var t = findById(state.tasks, id);
  if(!t) return;
  var idx = STATUSES.indexOf(t.status);
  if(idx < 0) idx = 0;
  var next = idx + dir;
  if(next < 0 || next >= STATUSES.length) return;
  t.status = STATUSES[next];
  if(t.status === '已上线') t.doneAt = new Date().toISOString();
  else t.doneAt = '';
  persist(); refreshAll();
  toast('已推进到「' + t.status + '」', '', 1500);
}

function renderMetrics(){

  }

    .slice().sort(function(a, b){ return a.date < b.date ? -1 : 1; });
  var unit = pts.length ? (pts[pts.length - 1].unit || '') : '';
  var recent = pts.slice(-12);
  var last = recent[recent.length - 1];
  var prev = recent.length > 1 ? recent[recent.length - 2] : null;
  var deltaHtml = '<span class="delta flat">暂无对比</span>';
  if(prev && prev.value !== 0){
    var diff = last.value - prev.value;
    var pct = (diff / Math.abs(prev.value)) * 100;
    var cls = diff > 0 ? 'up' : (diff < 0 ? 'down' : 'flat');
    var arrow = diff > 0 ? '↑' : (diff < 0 ? '↓' : '→');
    deltaHtml = '<span class="delta ' + cls + '">' + arrow + ' ' + fmtNum(Math.abs(diff)) +
      '（' + (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%）较上期</span>';
  }

  $('chartWrap').innerHTML =
    '<div class="chartbox">' +
      '<div class="ch">' +
        '<div><h4>' + esc(ui.metricPick) + '</h4>' +
        '<div style="font-size:11.5px;color:var(--ink-4);margin-top:3px">最近 ' + recent.length + ' 次记录 · ' +
          (recent[0] ? fmtMD(recent[0].date) + ' 至 ' + fmtMD(last.date) : '') + '</div></div>' +
        '<div style="text-align:right">' +
          '<div class="big">' + fmtNum(last.value) + '<span style="font-size:14px;color:var(--ink-3);margin-left:3px">' + esc(unit) + '</span></div>' +
          '<div style="margin-top:4px">' + deltaHtml + '</div>' +
        '</div>' +
      '</div>' +
      lineChart(recent, unit) +
      '<div class="chart-note">趋势只反映你记录过的点，不能替代真实埋点数据。</div>' +
    '</div>';
}
function lineChart(pts, unit){
  var W = 680, H = 240, L = 46, R = 16, T = 22, B = 44;
  var iw = W - L - R, ih = H - T - B;
  var n = pts.length;
  if(n === 0) return '';
  var vals = pts.map(function(p){ return clampNum(p.value); });
  var max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
  if(max === min){ max = max + Math.abs(max || 1) * 0.1; min = min - Math.abs(min || 1) * 0.1; }
  var padV = (max - min) * 0.16;
  max += padV; min -= padV;
  if(min > 0 && min - (max - min) * 0.2 > 0) min -= (max - min) * 0.12;

  function X(i){ return n === 1 ? L + iw / 2 : L + (iw * i / (n - 1)); }
  function Y(v){ return T + ih - ((v - min) / (max - min)) * ih; }

  var grid = '';
  for(var g = 0; g <= 3; g++){
    var gy = T + (ih * g / 3);
    var gv = max - ((max - min) * g / 3);
    grid += '<line x1="' + L + '" y1="' + gy.toFixed(1) + '" x2="' + (W - R) + '" y2="' + gy.toFixed(1) +
      '" stroke="rgba(33,31,28,.075)" stroke-width="1"/>' +
      '<text x="' + (L - 8) + '" y="' + (gy + 4).toFixed(1) + '" text-anchor="end" font-size="10.5" fill="#B4ADA2">' +
      esc(fmtNum(gv)) + '</text>';
  }

  var line = '', area = '';
  for(var i = 0; i < n; i++){
    line += (i === 0 ? 'M' : 'L') + X(i).toFixed(1) + ' ' + Y(vals[i]).toFixed(1) + ' ';
  }
  area = line + 'L' + X(n - 1).toFixed(1) + ' ' + (T + ih) + ' L' + X(0).toFixed(1) + ' ' + (T + ih) + ' Z';

  var dots = '';
  for(var d = 0; d < n; d++){
    var isLast = d === n - 1;
    dots += '<g class="ptdot"><title>' + esc(fmtMD(pts[d].date)) + '：' + esc(fmtNum(vals[d])) + esc(unit) + '</title>' +
      '<circle cx="' + X(d).toFixed(1) + '" cy="' + Y(vals[d]).toFixed(1) + '" r="' + (isLast ? 4.5 : 3) + '" fill="' +
      (isLast ? '#2E5B4E' : '#FFFFFF') + '" stroke="#2E5B4E" stroke-width="1.8"/></g>';
  }

  var labels = '';
  var step = n <= 6 ? 1 : Math.ceil(n / 5);
  for(var k = 0; k < n; k++){
    if(k % step !== 0 && k !== n - 1) continue;
    labels += '<text x="' + X(k).toFixed(1) + '" y="' + (T + ih + 20) + '" text-anchor="middle" font-size="10.5" fill="#B4ADA2">' +
      esc(fmtMD(pts[k].date)) + '</text>';
  }

  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="指标趋势折线图">' +
    '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#2E5B4E" stop-opacity=".16"/>' +
      '<stop offset="100%" stop-color="#2E5B4E" stop-opacity="0"/></linearGradient></defs>' +
    grid +
    '<path d="' + area + '" fill="url(#ag)"/>' +
    '<path d="' + line + '" fill="none" stroke="#2E5B4E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    dots + labels +
  '</svg>';
}

function buildWeekReport(startStr){
  var s = parseDate(startStr) || weekStart(new Date());
  var sStr = todayStr(s), eStr = todayStr(addDays(s, 6));
  var lines = [];
  lines.push('【周报】' + sStr + ' ~ ' + eStr);
  lines.push('');

  var doneList = state.tasks.filter(function(t){
    return t.doneAt && t.doneAt.slice(0,10) >= sStr && t.doneAt.slice(0,10) <= eStr;
  });
  lines.push('一、本周完成（' + doneList.length + ' 项）');
  if(doneList.length){
    for(var i = 0; i < doneList.length; i++){
      lines.push('· ' + doneList[i].title + (doneList[i].tags && doneList[i].tags.length ? '（' + doneList[i].tags.join('/') + '）' : ''));
    }
  }else lines.push('· 无');

  var newList = state.tasks.filter(function(t){
    return t.createdAt && t.createdAt.slice(0,10) >= sStr && t.createdAt.slice(0,10) <= eStr;
  });
  lines.push('');
  lines.push('二、本周新增需求（' + newList.length + ' 项）');
  if(newList.length){
    for(var j = 0; j < newList.length; j++){
      lines.push('· [' + newList[j].priority + '] ' + newList[j].title + ' — 当前状态：' + newList[j].status);
    }
  }else lines.push('· 无');

  var doing = state.tasks.filter(function(t){ return t.status !== '已上线'; });
  var over = doing.filter(function(t){ return t.due && t.due < sStr; });
  lines.push('');
  lines.push('三、进行中（' + doing.length + ' 项，其中逾期 ' + over.length + ' 项）');
  if(doing.length){
    for(var k = 0; k < doing.length; k++){
      var t = doing[k];
      lines.push('· [' + t.priority + '] ' + t.title + ' — ' + t.status + (t.due ? '，期望 ' + t.due + (over.indexOf(t) >= 0 ? '（已逾期）' : '') : ''));
    }
  }else lines.push('· 无');

  var meets = state.meetings.filter(function(m){ return m.date >= sStr && m.date <= eStr; });
  lines.push('');
  lines.push('四、会议与结论（' + meets.length + ' 场）');
  if(meets.length){
    for(var q = 0; q < meets.length; q++){
      var m = meets[q];
      lines.push('· ' + fmtMD(m.date) + ' ' + m.title);
      if(m.decisions) lines.push('  结论：' + m.decisions.replace(/\n/g, ' / '));
      var openFu = (m.followups || []).filter(function(f){ return !f.done; });
      if(openFu.length) lines.push('  待跟进：' + openFu.map(function(f){ return f.text; }).join('；'));
    }
  }else lines.push('· 无');

  var fuAll = [];
  state.meetings.forEach(function(m){
    (m.followups || []).forEach(function(f){
      if(!f.done && m.date <= eStr) fuAll.push(fmtMD(m.date) + ' ' + m.title + ' → ' + f.text);
    });
  });
  lines.push('');
  lines.push('五、待跟进事项（' + fuAll.length + ' 项）');
  if(fuAll.length){ for(var z = 0; z < fuAll.length; z++) lines.push('· ' + fuAll[z]); }
  else lines.push('· 无');

  var names = metricNames();
  lines.push('');
  lines.push('六、关键指标变化');
  if(names.length){
    for(var a = 0; a < names.length; a++){
      var nm = names[a];
      var ps = state.metrics.filter(function(d){ return d.name === nm; }).slice().sort(function(x, y){ return x.date < y.date ? -1 : 1; });
      var inWeek = ps.filter(function(d){ return d.date >= sStr && d.date <= eStr; });
      if(!inWeek.length && ps.length){
        inWeek = [ps[ps.length - 1]];
      }
      if(!inWeek.length) continue;
      var first = inWeek[0], last = inWeek[inWeek.length - 1];
      var unit = last.unit || '';
      var diff = last.value - first.value;
      var sign = diff > 0 ? '+' : (diff < 0 ? '-' : '');
      lines.push('· ' + nm + '：' + fmtNum(first.value) + ' → ' + fmtNum(last.value) + ' ' + unit +
        (diff !== 0 ? '（' + sign + fmtNum(Math.abs(diff)) + '）' : '（持平）'));
    }
  }else lines.push('· 本周未记录指标');

  lines.push('');
  lines.push('七、下周计划');
  var nextPlan = doing.slice(0, 5);
  if(nextPlan.length){ for(var b = 0; b < nextPlan.length; b++) lines.push('· ' + nextPlan[b].title); }
  else lines.push('· 待补充');
  lines.push('');
  lines.push('（本报表由产品工作台按周自动汇总，可手动调整后发送）');
  return lines.join('\n');
}
function copyText(text, okMsg){
  if(!text){ toast('没有可复制的内容', 'bad'); return; }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
    document.body.removeChild(ta);
    toast(ok ? (okMsg || '已复制到剪贴板') : '复制失败，请手动选中文本复制', ok ? 'good' : 'bad');
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(okMsg || '已复制到剪贴板', 'good'); }, fallback);
  }else fallback();
}

function bytesText(n){
  if(n < 1024) return n + ' B';
  if(n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
}
function currentSize(){
  try{ return JSON.stringify(state).length; }catch(e){ return 0; }
}
function downloadBlob(name, text, mime, bom){
  try{
    // 仅 CSV / TXT 加 BOM（Excel 识别中文需要）；JSON 绝不能加，否则自身导入会解析失败
    var blob = new Blob([(bom ? '\ufeff' : '') + text], { type:(mime || 'application/json') + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
    return true;
  }catch(e){ return false; }
}
function stampName(){
  var d = new Date();

function handleImportFile(file){
  if(!file) return;
  if(file.size > 40 * 1024 * 1024){ toast('文件过大（>40MB），请确认是不是导出文件', 'bad'); return; }
  var reader = new FileReader();
  reader.onerror = function(){ toast('文件读取失败，请重试', 'bad'); };
  reader.onload = function(){
    var text = String(reader.result || '');
    var parsed;
    try{
      parsed = JSON.parse(text);
    }catch(e){
      toast('导入失败：不是合法的 JSON 文件', 'bad', 3600);
      return;
    }
    var payload = (parsed && parsed.data && typeof parsed.data === 'object') ? parsed.data : parsed;
    if(!payload || typeof payload !== 'object'){
      toast('导入失败：文件结构不认识', 'bad'); return;
    }
    var counts = ['tasks','meetings','metrics','ideas','reports'].map(function(k){
      return (payload[k] && payload[k].length) || 0;
    });
    var total = counts.reduce(function(a, b){ return a + b; }, 0);
    if(total === 0){ toast('这个备份里没有任何记录', 'bad'); return; }

    var incoming = normalize(payload);
    var body =
      '<p>文件包含：需求 <b>' + incoming.tasks.length + '</b> 条、会议 <b>' + incoming.meetings.length +
      '</b> 条、指标 <b>' + incoming.metrics.length + '</b> 条、素材 <b>' + incoming.ideas.length +
      '</b> 条、周报 <b>' + incoming.reports.length + '</b> 份，合计 <b>' + total + '</b> 条。没有条数上限，会全部读入。</p>' +
      '<ul style="margin:10px 0 0 18px;padding:0;font-size:13px;line-height:1.9;color:var(--ink-2)">' +
        '<li><b>合并</b>：按记录 ID 去重，已有的更新、新的追加（推荐，不会丢现有数据）</li>' +
        '<li><b>覆盖</b>：清空当前全部数据，完全以文件内容为准</li>' +
      '</ul>';
    confirmBox2('确认导入方式', body, '合并导入', function(){ applyImport(incoming, 'merge'); },
      '覆盖导入', function(){ applyImport(incoming, 'replace'); });
  };
  reader.readAsText(file, 'utf-8');
}

      '<button class="btn danger" data-x="alt">' + esc(altText) + '</button>' +

  mask.querySelector('[data-x="alt"]').onclick = function(){ closeModal(); onAlt(); };
}
function applyImport(incoming, mode){
  var keys = ['tasks','meetings','metrics','ideas','reports'];
  if(mode === 'replace'){
    state = incoming;
  }else{
    for(var i = 0; i < keys.length; i++){
      var k = keys[i], map = {};
      for(var a = 0; a < state[k].length; a++) map[state[k][a].id] = state[k][a];
      for(var b = 0; b < incoming[k].length; b++) map[incoming[k][b].id] = incoming[k][b];
      var merged = [];
      for(var id in map){ if(Object.prototype.hasOwnProperty.call(map, id)) merged.push(map[id]); }
      state[k] = merged;
    }
    state.meta.sinceExport = 0;
    state.meta.lastExport = new Date().toISOString();

      '<p style="font-size:11.5px;color:var(--ink-4);margin-top:6px;line-height:1.8">' + esc(snapInfo) + '</p>' +
    '</div>' +

    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn" id="stExp">' + ic('down',15) + '导出 JSON 备份</button>' +
      '<button class="btn" id="stCsv">' + ic('doc',15) + '导出需求 CSV</button>' +
      '<button class="btn" id="stImp">' + ic('up',15) + '导入 JSON</button>' +
      '<button class="btn" id="stSnap"' + (snapRaw ? '' : ' disabled style="opacity:.5"') + '>' + ic('refresh',15) + '从快照回滚</button>' +
    '</div>' +

    '<div style="border:1px solid rgba(174,74,48,.28);border-radius:var(--r);padding:14px 16px;background:var(--danger-soft)">' +
      '<div style="font-size:11.5px;letter-spacing:.14em;color:var(--danger);margin-bottom:8px">危险操作</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn sm danger" id="stClearDemo">清空演示数据</button>' +
        '<button class="btn sm danger" id="stClearAll">清空全部数据</button>' +
      '</div>' +
      '<p style="font-size:11.5px;color:var(--ink-3);margin-top:9px">清空不可恢复，建议先导出备份。</p>' +
    '</div>';

  var mask = openModal(sheetHtml('设置与数据', body, '<button class="btn solid" data-x="ok">完成</button>'));
  bindSheetClose(mask);
  mask.querySelector('[data-x="ok"]').onclick = function(){
    var v = mask.querySelector('#stOwner').value.trim();
    if(v !== state.meta.owner){ state.meta.owner = v; persist(); }
    closeModal(); refreshAll();
  };
  mask.querySelector('#stExp').onclick = function(){ closeModal(); doExport(); };
  mask.querySelector('#stCsv').onclick = doExportCSV;
  mask.querySelector('#stImp').onclick = function(){ closeModal(); $('fileInput').click(); };
  mask.querySelector('#stSnap').onclick = function(){
    if(!snapRaw) return;
    confirmBox('从快照回滚？', '会用上一次保存前的数据覆盖当前内容（仅需求、会议、指标、素材、周报）。当前状态无法找回。',
      '确认回滚', function(){
        try{
          var sd = normalize(JSON.parse(snapRaw));
          state = sd; lastJson = '';
          persist(); refreshAll();
          toast('已回滚到上一个快照', 'good');
        }catch(e){ toast('快照无法解析，回滚失败', 'bad'); }
      }, true);
  };
  mask.querySelector('#stClearDemo').onclick = function(){ closeModal(); clearDemo(); };
  mask.querySelector('#stClearAll').onclick = function(){
    closeModal();
    confirmBox('清空全部数据？',
      '将删除本工作台的所有记录（共 <b>' + totalRecords() + '</b> 条），并移除本地快照。此操作<b>不可恢复</b>。<br><br>确定请点「确认清空」。',
      '确认清空', function(){
        lsDel(K_DATA); lsDel(K_SNAP); lsDel(K_META);
        state = blankState(); lastJson = '';
        persist(); refreshAll();
        toast('已清空', 'good');
      }, true);
  };
}
/* ---- 数据损坏恢复 ---- */
function showRecovery(raw, msg){
  var snap = lsGet(K_SNAP);
  var snapOk = false, snapInfo = '没有可用的自动快照';
  if(snap){
    try{
      var sd = JSON.parse(snap);
      var c = ['tasks','meetings','metrics','ideas','reports'].map(function(k){ return (sd[k] && sd[k].length) || 0; })
        .reduce(function(a, b){ return a + b; }, 0);
      snapOk = c >= 0; snapInfo = '自动快照可读，含 ' + c + ' 条记录';
    }catch(e){ snapOk = false; snapInfo = '快照也损坏了'; }
  }
  var body =
    '<p>本地存储里的数据无法解析，工作台已暂停读取，<b>没有做任何覆盖</b>。原始内容仍然保留在浏览器里，可以按下面三种方式处理：</p>' +
    '<ul class="recover-list">' +
      '<li><b>从自动快照恢复</b>：' + esc(snapInfo) + '。快照是上一次成功保存前的数据，最多丢一次改动。</li>' +
      '<li><b>下载损坏数据</b>：把原始文本存成文件，可以自己用编辑器修好再导入。</li>' +
      '<li><b>重置</b>：清掉损坏内容，用一份干净的演示数据重新开始（现有内容将被覆盖）。</li>' +
    '</ul>' +
    '<p style="margin-top:12px;font-size:11.5px;color:var(--ink-4)">技术信息：' + esc(msg || '解析失败') +
      ' · 原始数据约 ' + bytesText(String(raw || '').length) + '</p>';
  var mask = openModal(
    '<div class="dialog"><h3 style="color:var(--danger)">' + ic('alert',17) + ' 本地数据读取失败</h3>' +
      '<div class="recover">' + body + '</div>' +
      '<div class="dlg-acts">' +
        '<button class="btn" data-x="dl" style="margin-right:auto">下载损坏数据</button>' +
        '<button class="btn danger" data-x="reset">重置</button>' +
        '<button class="btn solid" data-x="snap"' + (snapOk ? '' : ' disabled style="opacity:.5"') + '>从快照恢复</button>' +
      '</div>' +
    '</div>', { center:true, noClose:true });
  mask.setAttribute('data-lock', '1');
  mask.querySelector('[data-x="dl"]').onclick = function(){
    downloadBlob('产品工作台_损坏数据_' + stampName() + '.txt', String(raw || ''), 'text/plain', true);
    toast('已下载，可自行修复后再导入');
  };
  mask.querySelector('[data-x="reset"]').onclick = function(){
    state = demoState(); lastJson = '';
    lsDel(K_SNAP);
    persist();
    closeModal(); refreshAll();
    toast('已重置为演示数据', 'good');
  };
  mask.querySelector('[data-x="snap"]').onclick = function(){
    if(!snapOk) return;
    try{
      var sd = normalize(JSON.parse(snap));
      sd.meta.demo = false;
      state = sd; lastJson = '';
      persist();
      closeModal(); refreshAll();
      toast('已从快照恢复', 'good');
    }catch(e){ toast('快照也无法解析，请下载损坏数据后手动修复', 'bad', 3600); }
  };
}

/* ========================================================================
   13. 事件绑定
   ======================================================================== */
function bindEvents(){
  $('nav').onclick = function(e){
    var b = e.target.closest ? e.target.closest('[data-nav]') : null;
    if(b) switchView(b.getAttribute('data-nav'));
  };
  $('btnExport').onclick = doExport;
  $('railBackup').onclick = doExport;
  $('btnImport').onclick = function(){ $('fileInput').click(); };
  $('btnSettings').onclick = openSettings;
  $('fileInput').onchange = function(){
    var f = this.files && this.files[0];
    handleImportFile(f);
    this.value = '';
  };

  // 今日：快速记录
  $('quickForm').onsubmit = function(e){
    e.preventDefault();
    var title = $('qTitle').value.trim();
    if(!title){ toast('先写一句要做什么', 'bad'); return; }
    state.tasks.unshift({
      id:uid('t'), title:title, desc:'', status:'待评估', priority:$('qPrio').value,
      owner:state.meta.owner || '我', due:$('qDue').value || todayStr(), tags:[],
      createdAt:new Date().toISOString(), doneAt:'', fromMeeting:''
    });
    $('qTitle').value = '';
    persist(); touchAdd(1);
    refreshAll();
    $('qTitle').focus();
    toast('已记下', 'good', 1400);
  };

  // 需求看板
  $('bQ').oninput = function(){ ui.q = this.value; renderBoard(); };
  $('bPrio').onchange = function(){ ui.prio = this.value; renderBoard(); };
  $('bOwner').onchange = function(){ ui.owner = this.value; renderBoard(); };
  $('bNew').onclick = function(){ openTaskSheet(null); };
  var segs = document.querySelectorAll('[data-bv]');
  for(var i = 0; i < segs.length; i++){
    segs[i].onclick = function(){
      ui.boardView = this.getAttribute('data-bv');
      var all = document.querySelectorAll('[data-bv]');
      for(var j = 0; j < all.length; j++) all[j].className = (all[j].getAttribute('data-bv') === ui.boardView ? 'on' : '');
      renderBoard();
    };
  }

  // 会议
  $('mQ').oninput = function(){ ui.meetQ = this.value; renderMeetings(); };
  $('mNew').onclick = function(){ openMeetSheet(null); };

  // 数据与周报
  $('tNew').onclick = openMetricSheet;
  $('rStart').onchange = function(){ ui.reportStart = this.value; };
  $('rGen').onclick = function(){
    ui.reportStart = $('rStart').value || todayStr(weekStart(new Date()));
    var txt = buildWeekReport(ui.reportStart);
    ui.reportDraft = txt;
    $('rText').value = txt;
    toast('已按 ' + fmtMD(ui.reportStart) + ' 开始的那一周生成', 'good', 2000);
  };
  $('rText').oninput = function(){ ui.reportDraft = this.value; };
  $('rCopy').onclick = function(){
    var txt = $('rText').value || ui.reportDraft;
    if(!txt){ $('rGen').onclick(); }
    copyText($('rText').value || ui.reportDraft, '周报已复制，去粘贴吧');
  };
  $('rSave').onclick = function(){
    var txt = $('rText').value.trim();
    if(!txt){ toast('先生成内容再存档', 'bad'); return; }
    var start = $('rStart').value || todayStr(weekStart(new Date()));
    var exist = null;
    for(var i = 0; i < state.reports.length; i++){
      if(state.reports[i].start === start) exist = state.reports[i];
    }
    if(exist){ exist.content = txt; exist.createdAt = new Date().toISOString(); }
    else state.reports.unshift({ id:uid('r'), start:start, content:txt, createdAt:new Date().toISOString() });
    persist(); touchAdd(exist ? 0 : 1);
    renderReports(); renderBanners();
    toast(exist ? '已更新该周存档' : '已存档', 'good');
  };

  // 素材
  $('iQ').oninput = function(){ ui.ideaQ = this.value; renderIdeas(); };
  $('iNew').onclick = function(){ openIdeaSheet(null); };

  // 全局键盘
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && modalStack.length){
      var top = modalStack[modalStack.length - 1];
      if(top.getAttribute('data-lock') !== '1') closeModal();   // 损坏恢复弹窗必须做选择，不允许 ESC 逃逸
    }
    if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
      var m = modalStack[modalStack.length - 1];
      if(m){
        var ok = m.querySelector('[data-x="save"]');
        if(ok){ e.preventDefault(); ok.click(); }
      }
    }
  });
  // 存储异常提示：数据只在内存时的兜底
  window.addEventListener('beforeunload', function(){ if(!store.ok && state) persist(); });
}

/* ========================================================================
   14. 启动
   ======================================================================== */
function boot(){
  buildShells();
  bindEvents();
  $('qDue').value = todayStr();
  renderSaveState();

  var corrupt = null;
  if(!lsOk()){
    store.ok = false;
    store.err = '当前浏览器环境不支持或禁用了本地存储（可能处于隐私模式）';
  }

  var raw = null;
  try{ raw = lsGet(K_DATA); }catch(e){ raw = null; }

  if(raw){
    try{
      var parsed = JSON.parse(raw);
      if(!parsed || typeof parsed !== 'object') throw new Error('顶层结构不是对象');
      state = normalize(parsed);
      lastJson = JSON.stringify(state);
    }catch(err){
      corrupt = { raw:raw, msg:(err && err.message) || 'JSON 解析失败' };
    }
  }
  if(!state){
    if(corrupt) state = blankState();
    else { state = demoState(); persist(); }
  }
  refreshAll();
  if(corrupt) showRecovery(corrupt.raw, corrupt.msg);
  else if(!store.ok) toast('本地存储不可用，数据这次只能临时保存', 'bad', 4000);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
}else{
  boot();
}
})();
</script>
